[pytest]
# test_api.py is a standalone live-server script (run it directly with
# `python test_api.py` against a running Flask instance) — its checks use
# a custom pass/fail counter, not `assert`, so pytest would silently mark
# every one of them "passed" regardless of outcome if it collected them.
# test_xai.py is the real pytest suite (uses Flask's in-process test
# client + actual `assert`s) — that's what `pytest` should run.
testpaths = test_xai.py
